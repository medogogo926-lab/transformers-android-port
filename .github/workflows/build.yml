name: Build Transformers Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android SDK Components manually
      run: |
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
        echo "y" | sudo ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-33" "build-tools;33.0.2" || true

    - name: Create Assets Directory
      run: |
        mkdir -p app/src/main/assets

    - name: Download Game Datasets from Google Drive
      run: |
        echo "Downloading GER.DAT..."
        wget -O app/src/main/assets/GER.DAT "https://drive.google.com/uc?export=download&id=1jJUBT-fClcq4jj5JAivLTitUg9QVq7Zh"
        
        echo "Downloading ITA.DAT..."
        wget -O app/src/main/assets/ITA.DAT "https://drive.google.com/uc?export=download&id=1tdXtd0QD8iqswr2SoTvQ7UXcUIpgtjrh"
        
        echo "Downloading TRANS.DAT..."
        wget -O app/src/main/assets/TRANS.DAT "https://drive.google.com/uc?export=download&id=1-jR-Otfa28OCjQTlG3HdjpVi12mHgHUi"

    - name: Build APK Directly with Android Build Tools
      run: |
        cd app
        javac src/main/java/**/*.java || true
        # تجميع ملفات التطبيق بشكل مباشر وسريع
        echo "Packaging APK..."

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Transformers-Android-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
